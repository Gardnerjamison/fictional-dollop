<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#10182c">
<title>SPITZ SIEGE</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;background:#0a0e1a;overflow:hidden;}
  body{
    font-family:'Courier New',monospace;
    display:flex;align-items:center;justify-content:center;
    -webkit-font-smoothing:none;
    color:#fff;
    user-select:none;-webkit-user-select:none;
  }
  #wrap{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;}
  canvas#screen{
    image-rendering:pixelated;image-rendering:crisp-edges;
    display:block;background:#10182c;
    cursor:crosshair;
  }
  /* ---- Retro UI ---- */
  .panel{
    background:#141a2e;
    border:3px solid #fff;
    box-shadow:0 0 0 3px #000, 4px 4px 0 3px rgba(0,0,0,.5);
    image-rendering:pixelated;
  }
  .ovl{position:absolute;z-index:5;}
  /* HUD */
  #hud{top:10px;left:10px;padding:8px 12px;font-size:13px;line-height:1.5;letter-spacing:1px;display:none;}
  #hud.show{display:block;}
  #hud .row{display:flex;gap:14px;align-items:center;}
  #hud b{color:#ffd23f;}
  .pill{background:#000;border:2px solid #3a4a6a;padding:1px 6px;}
  /* bottom bars */
  #buildBar,#battleBar{
    bottom:12px;left:50%;transform:translateX(-50%);
    padding:8px 10px;display:none;gap:8px;align-items:center;flex-wrap:wrap;
    max-width:96vw;justify-content:center;
  }
  #buildBar.show,#battleBar.show{display:flex;}
  .tbtn{
    background:#1d2742;border:2px solid #46598a;color:#cfe0ff;
    padding:6px 9px;font-family:inherit;font-weight:bold;font-size:11px;
    cursor:pointer;letter-spacing:1px;min-width:62px;text-align:center;line-height:1.25;
  }
  .tbtn small{display:block;font-size:9px;color:#8fa3c8;font-weight:normal;}
  .tbtn:hover{border-color:#ffd23f;}
  .tbtn.sel{border-color:#36e07a;background:#173a26;color:#bdfdd2;}
  .tbtn.lock{opacity:.4;cursor:not-allowed;}
  .tbtn.go{background:#2a5d2a;border-color:#7be07b;color:#eaffea;min-width:120px;font-size:13px;padding:8px;}
  .tbtn.go:hover{background:#36e07a;color:#04110a;}
  .sep{width:2px;align-self:stretch;background:#2c3a5a;margin:0 2px;}
  .lbl{font-size:10px;color:#8fa3c8;letter-spacing:1px;align-self:center;padding:0 2px;text-transform:uppercase;}
  /* top-right buttons */
  #sys{top:10px;right:10px;display:flex;gap:6px;}
  #sys .tbtn{min-width:auto;padding:6px 8px;}
  /* Title */
  #title{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;}
  #title.hide{display:none;}
  #title h1{
    font-size:clamp(38px,9vw,92px);letter-spacing:6px;
    color:#ffd23f;text-shadow:4px 4px 0 #b3471e,8px 8px 0 #000;
    margin-bottom:4px;font-weight:900;
  }
  #title .sub{color:#9fd3ff;letter-spacing:4px;font-size:clamp(11px,2vw,16px);margin-bottom:30px;text-shadow:2px 2px 0 #000;}
  #title .menu{display:flex;flex-direction:column;gap:14px;}
  #title .mbtn{
    background:#141a2e;border:3px solid #fff;box-shadow:0 0 0 3px #000;
    color:#fff;font-family:inherit;font-weight:bold;font-size:18px;letter-spacing:3px;
    padding:14px 50px;cursor:pointer;transition:transform .08s;
  }
  #title .mbtn:hover{background:#ffd23f;color:#141a2e;transform:scale(1.04);}
  #title .ft{margin-top:34px;color:#5e6f93;font-size:11px;letter-spacing:2px;}
  /* Tutorial box */
  #tut{bottom:84px;left:50%;transform:translateX(-50%);max-width:560px;width:90vw;padding:14px 16px;display:none;z-index:8;}
  #tut.show{display:block;}
  #tut .who{color:#ffd23f;font-weight:bold;letter-spacing:2px;font-size:12px;margin-bottom:6px;}
  #tut .msg{font-size:14px;line-height:1.5;color:#eaf2ff;}
  #tut .nx{margin-top:10px;text-align:right;}
  /* Banner / toast */
  #banner{top:42%;left:50%;transform:translate(-50%,-50%);z-index:9;text-align:center;display:none;
    padding:18px 40px;}
  #banner.show{display:block;animation:pop .3s;}
  #banner h2{font-size:clamp(26px,6vw,52px);letter-spacing:4px;color:#ffd23f;text-shadow:3px 3px 0 #000;}
  #banner p{margin-top:8px;color:#cfe0ff;letter-spacing:2px;font-size:14px;}
  @keyframes pop{from{transform:translate(-50%,-50%) scale(.6);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
  /* Game over */
  #over{position:absolute;inset:0;z-index:12;display:none;align-items:center;justify-content:center;background:rgba(5,8,16,.72);}
  #over.show{display:flex;}
  #over .box{padding:40px 50px;text-align:center;}
  #over h1{font-size:clamp(34px,8vw,72px);letter-spacing:4px;margin-bottom:10px;text-shadow:4px 4px 0 #000;}
  #over p{font-size:16px;color:#cfe0ff;margin-bottom:26px;letter-spacing:1px;}
  .hintbar{font-size:11px;color:#8fa3c8;letter-spacing:1px;text-align:center;width:100%;margin-top:2px;}
  kbd{background:#000;border:1px solid #46598a;border-radius:3px;padding:0 5px;color:#cfe0ff;font-family:inherit;}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="screen"></canvas>

  <!-- HUD -->
  <div id="hud" class="ovl panel">
    <div class="row">
      <span style="color:#ff9a52">🐕 CORGIS</span>
      <span class="pill" id="hudGold">💰 0</span>
      <span class="pill" id="hudRound">ROUND 1</span>
      <span class="pill" id="hudPhase">BUILD</span>
      <span class="pill" id="hudTimer">⏱ 30</span>
    </div>
  </div>

  <!-- System buttons -->
  <div id="sys" class="ovl">
    <button class="tbtn" id="muteBtn" title="Mute">🔊</button>
    <button class="tbtn" id="menuBtn" title="Menu">MENU</button>
  </div>

  <!-- Build toolbar -->
  <div id="buildBar" class="ovl panel">
    <span class="lbl">Walls</span>
    <button class="tbtn matbtn sel" data-mat="wood">WOOD<small>$6 · HP60</small></button>
    <button class="tbtn matbtn" data-mat="stone">STONE<small>$12 · HP130</small></button>
    <button class="tbtn matbtn" data-mat="iron">IRON<small>$22 · HP220</small></button>
    <span class="sep"></span>
    <span class="lbl">Army</span>
    <button class="tbtn unitbtn" data-unit="soldier">SOLDIER<small>$15</small></button>
    <button class="tbtn unitbtn" data-unit="archer">ARCHER<small>$22</small></button>
    <button class="tbtn unitbtn" data-unit="knight">KNIGHT<small>$38</small></button>
    <span class="sep"></span>
    <button class="tbtn go" id="doneBtn">⚔ DONE — FIGHT!</button>
  </div>

  <!-- Battle toolbar -->
  <div id="battleBar" class="ovl panel">
    <span class="lbl">Ammo</span>
    <button class="tbtn ammobtn sel" data-ammo="standard">CANNON<small>balanced</small></button>
    <button class="tbtn ammobtn" data-ammo="heavy">HEAVY<small>big hit</small></button>
    <button class="tbtn ammobtn" data-ammo="cluster">CLUSTER<small>splits ×3</small></button>
    <button class="tbtn ammobtn" data-ammo="bomb">BOMB<small>explosive</small></button>
    <span class="sep"></span>
    <span class="lbl">Shots</span>
    <span class="pill" id="shotsLeft">●●●●●</span>
  </div>

  <!-- Tutorial -->
  <div id="tut" class="ovl panel">
    <div class="who">⚔ COMMANDER</div>
    <div class="msg" id="tutMsg"></div>
    <div class="nx"><button class="tbtn" id="tutNext">NEXT ▶</button></div>
  </div>

  <!-- Banner -->
  <div id="banner" class="ovl panel"><h2 id="bannerH"></h2><p id="bannerP"></p></div>

  <!-- Title -->
  <div id="title" class="ovl">
    <h1>SPITZ&nbsp;SIEGE</h1>
    <div class="sub">CELTIC CORGIS · vs · VIKING LAIKAS</div>
    <div class="menu">
      <button class="mbtn" id="playBtn">▶ PLAY</button>
      <button class="mbtn" id="tutBtn">📖 TUTORIAL</button>
    </div>
    <div class="ft">DRAG to aim the cannon · build walls · command your army</div>
  </div>

  <!-- Game Over -->
  <div id="over" class="ovl">
    <div class="box panel">
      <h1 id="overH"></h1>
      <p id="overP"></p>
      <button class="tbtn go" id="againBtn" style="margin:0 auto;">↻ PLAY AGAIN</button>
    </div>
  </div>
</div>

<script>
"use strict";
/* ============================================================= *
 *  SPITZ SIEGE  —  a 2D side-view siege game
 *  (Rampart x Angry Birds x King Arthur's World)
 *  Single-file, low-res pixel buffer upscaled for a SNES/DS look.
 * ============================================================= */

/* ---------- Display / buffer ---------- */
const VIEW_W = 480, VIEW_H = 270;
const WORLD_W = 960;
const GROUND_Y = 212;          // top of the grass
const TILE = 16;

const screen = document.getElementById('screen');
const sx = screen.getContext('2d');
const buf = document.createElement('canvas');
buf.width = VIEW_W; buf.height = VIEW_H;
const g = buf.getContext('2d');

let scale = 1, offX = 0, offY = 0;
function resize(){
  const w = window.innerWidth, h = window.innerHeight;
  scale = Math.max(1, Math.floor(Math.min(w/VIEW_W, h/VIEW_H)));
  screen.width = w; screen.height = h;
  offX = Math.floor((w - VIEW_W*scale)/2);
  offY = Math.floor((h - VIEW_H*scale)/2);
  sx.imageSmoothingEnabled = false;
}
window.addEventListener('resize', resize); resize();

/* ---------- Config ---------- */
const MAT = {
  wood:  {hp:60,  cost:6,  col:'#9a5a2b', col2:'#7a4420', edge:'#c98a4a'},
  stone: {hp:130, cost:12, col:'#7f8a9c', col2:'#5d6776', edge:'#aab6c6'},
  iron:  {hp:220, cost:22, col:'#5a6170', col2:'#3f4654', edge:'#9aa6bb'},
};
const UNIT = {
  soldier:{hp:70,  cost:15, spd:0.42, dmg:8,  cd:38,  rng:0,   melee:11, w:10,h:18, name:'Soldier'},
  archer: {hp:42,  cost:22, spd:0.40, dmg:9,  cd:64,  rng:104, melee:11, w:9, h:18, name:'Archer'},
  knight: {hp:160, cost:38, spd:0.32, dmg:16, cd:50,  rng:0,   melee:13, w:13,h:20, name:'Knight'},
};
const AMMO = {
  standard:{dmg:55, spd:1.0,  r:3, name:'Cannon'},
  heavy:   {dmg:110,spd:0.82, r:4, name:'Heavy'},
  cluster: {dmg:34, spd:1.05, r:3, name:'Cluster', split:3},
  bomb:    {dmg:46, spd:0.94, r:4, name:'Bomb', boom:64},
};
const CANNON_G = 0.12;   // cannonball gravity
const DEBRIS_G = 0.34;
const MAXPULL  = 116;
const SHOTS_PER_BATTLE = 5;
const BUILD_TIME = 30;
const BATTLE_TIME = 26;

/* ---------- Audio (tiny synth) ---------- */
let actx=null, muted=false;
function ac(){ if(!actx){ try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } return actx; }
function beep(freq, dur=0.08, type='square', vol=0.13, slide=0){
  if(muted) return; const a=ac(); if(!a) return;
  const o=a.createOscillator(), gn=a.createGain();
  o.type=type; o.frequency.value=freq;
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,freq+slide), a.currentTime+dur);
  gn.gain.value=vol; gn.gain.exponentialRampToValueAtTime(0.0001, a.currentTime+dur);
  o.connect(gn); gn.connect(a.destination); o.start(); o.stop(a.currentTime+dur);
}
function noise(dur=0.16, vol=0.18){
  if(muted) return; const a=ac(); if(!a) return;
  const n=Math.floor(a.sampleRate*dur); const b=a.createBuffer(1,n,a.sampleRate); const d=b.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  const s=a.createBufferSource(); s.buffer=b; const gn=a.createGain(); gn.gain.value=vol;
  const f=a.createBiquadFilter(); f.type='lowpass'; f.frequency.value=900;
  s.connect(f); f.connect(gn); gn.connect(a.destination); s.start();
}
const SFX={
  fire(){ beep(220,0.18,'square',0.16,-160); noise(0.12,0.12); },
  place(){ beep(440,0.05,'square',0.1); },
  pick(){ beep(620,0.04,'square',0.08); },
  hit(){ noise(0.1,0.14); beep(160,0.06,'square',0.08,-60); },
  destroy(){ noise(0.22,0.2); beep(120,0.16,'sawtooth',0.12,-70); },
  arrow(){ beep(900,0.05,'square',0.05,-300); },
  win(){ [523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,0.16,'square',0.14),i*120)); },
  lose(){ [392,330,262,196].forEach((f,i)=>setTimeout(()=>beep(f,0.2,'sawtooth',0.13),i*150)); },
};

/* ---------- Game state ---------- */
const ST = {TITLE:'title', BUILD:'build', BATTLE:'battle', OVER:'over'};
let state = ST.TITLE;
let tutorial = null;           // tutorial controller or null
let round = 1;
let phaseTime = 0;             // seconds remaining in current phase
let paused = false;

let players = null;
let projectiles = [];
let units = [];
let debris = [];
let particles = [];
let floaters = [];
let camX = 0, camTargetX = 0;
let shake = 0, flash = 0, slowmo=0;
let frame = 0;

// build UI selection
let curMat = 'wood';
let curAmmo = 'standard';
let shotsLeft = SHOTS_PER_BATTLE;

// aiming
let aim = {active:false, sx:0, sy:0, mx:0, my:0};
let mouseWorld = {x:0,y:0};
let hoverCell = null;

function key(gx,gy){ return gx+'_'+gy; }
function cellAt(x,y){ return {gx:Math.floor(x/TILE), gy:Math.floor((GROUND_Y - y)/TILE)}; }
function blockXY(gx,gy){ return {x:gx*TILE, y:GROUND_Y-(gy+1)*TILE}; }

function makePlayer(side){
  const isL = side==='L';
  return {
    side, isL,
    gold: 70,
    cells: new Map(),                 // "gx_gy" -> block
    king: {x: isL?116:WORLD_W-116, hp:300, max:300, shake:0},
    cannon: {x: isL?42:WORLD_W-42, y:GROUND_Y-30, ang:isL?-42:-138},
    spawnX: isL?150:WORLD_W-150,
    dir: isL?1:-1,
    zone: isL?[80,360]:[WORLD_W-360, WORLD_W-80],
    queue: [],                        // unit types queued for this battle
    cannonCD: 0,
  };
}

function startGame(isTut){
  tutorial = isTut ? makeTutorial() : null;
  round = 1;
  players = {L: makePlayer('L'), R: makePlayer('R')};
  projectiles=[]; units=[]; debris=[]; particles=[]; floaters=[];
  shake=0; flash=0; slowmo=0; camX=0; camTargetX=0;
  curMat='wood'; curAmmo='standard';
  if(isTut){ players.L.gold = 120; players.R.gold = 0; }
  // give the AI a little starter wall so the field reads well
  if(!isTut) aiSeedWall();
  enterBuild();
  document.getElementById('title').classList.add('hide');
  document.getElementById('over').classList.remove('show');
  document.getElementById('hud').classList.add('show');
  refreshMatUI();
}

function enterBuild(){
  state = ST.BUILD;
  phaseTime = BUILD_TIME;
  // income each round (not first)
  if(round>1){ players.L.gold += 40 + round*6; players.R.gold += 40 + round*6; }
  players.L.queue = []; players.R.queue = [];
  shotsLeft = SHOTS_PER_BATTLE;
  camTargetX = clampCam(players.L.king.x - VIEW_W/2);
  showBar('build');
  if(tutorial) tutorial.onPhase('build');
  refreshHUD();
}

function startBattle(){
  if(state!==ST.BUILD) return;
  state = ST.BATTLE;
  phaseTime = BATTLE_TIME;
  shotsLeft = SHOTS_PER_BATTLE;
  // AI plans its army & build refinements right before the clash
  if(!tutorial) aiBuildPhase();
  // AI cannon: limited shots + opening delay so the player isn't bombed instantly
  players.R.cannonCD = 150;
  players.R.aiShots = tutorial ? 0 : (3 + Math.floor(round*0.8));
  // turn queues into a spawn schedule
  scheduleSpawns(players.L);
  scheduleSpawns(players.R);
  showBar('battle');
  banner('FIGHT!', 'Drag from your cannon to aim');
  if(tutorial) tutorial.onPhase('battle');
  SFX.fire();
  refreshHUD();
}

function endBattle(){
  // resolve round; check victory handled elsewhere
  units = []; projectiles = projectiles.filter(p=>false);
  round++;
  enterBuild();
  banner('ROUND '+round, 'Rebuild and reinforce!');
}

/* ---------- Spawning units ---------- */
function scheduleSpawns(pl){
  pl._toSpawn = pl.queue.map((t,i)=>({type:t, at: 18 + i*26}));
  pl._spawnFrame = 0;
}
function spawnUnit(pl, type){
  const u = UNIT[type];
  units.push({
    side: pl.side, type,
    x: pl.spawnX, y: GROUND_Y - u.h,
    hp: u.hp, max: u.hp,
    dir: pl.dir,
    cd: Math.floor(Math.random()*20),
    anim: Math.random()*6|0,
    state:'march',
  });
}

/* ============================================================= *
 *  INPUT
 * ============================================================= */
function toWorld(e){
  const r = screen.getBoundingClientRect();
  const px = (e.clientX - r.left - offX)/scale;
  const py = (e.clientY - r.top  - offY)/scale;
  return {x: px + camX, y: py, bx:px, by:py};
}
screen.addEventListener('mousemove', e=>{
  const w = toWorld(e); mouseWorld = w;
  if(state===ST.BUILD){
    const c = cellAt(w.x, w.y);
    hoverCell = c;
  }
  if(aim.active){ aim.mx=w.x; aim.my=w.y; }
});
screen.addEventListener('mousedown', e=>{
  if(paused) return;
  const w = toWorld(e);
  if(state===ST.BUILD){
    handleBuildClick(w, e.button);
  } else if(state===ST.BATTLE){
    if(e.button===0 && shotsLeft>0){
      aim.active=true; aim.sx=w.x; aim.sy=w.y; aim.mx=w.x; aim.my=w.y;
    }
  }
});
window.addEventListener('mouseup', e=>{
  if(aim.active){
    aim.active=false;
    fireFromAim();
  }
});
screen.addEventListener('contextmenu', e=>{ e.preventDefault();
  if(state===ST.BUILD){ const w=toWorld(e); removeBlockAt(w); }
});
// keyboard camera pan + pause
const keys={};
window.addEventListener('keydown', e=>{
  keys[e.key.toLowerCase()]=true;
  if(e.key==='p'||e.key==='P') paused=!paused;
  if(e.code==='Space' && state===ST.BUILD){ e.preventDefault(); startBattle(); }
});
window.addEventListener('keyup', e=>{ keys[e.key.toLowerCase()]=false; });

/* ---------- Build interactions ---------- */
function inZone(pl, x){ return x>=pl.zone[0] && x<pl.zone[1]; }
function handleBuildClick(w, btn){
  const pl = players.L;
  if(btn!==0){ removeBlockAt(w); return; }
  const c = cellAt(w.x, w.y);
  if(c.gy<0 || c.gy>9) return;
  const bx = blockXY(c.gx,c.gy);
  if(!inZone(pl, bx.x+TILE/2)){ floater(bx.x, bx.y-8, 'OUT OF ZONE', '#ff6b6b'); return; }
  const k = key(c.gx,c.gy);
  if(pl.cells.has(k)){ // remove on click too (toggle)
    removeBlockAt(w); return;
  }
  // support rule: ground row or block below
  const supported = c.gy===0 || pl.cells.has(key(c.gx,c.gy-1));
  if(!supported){ floater(bx.x, bx.y-8, 'NEEDS SUPPORT', '#ffd23f'); return; }
  const m = MAT[curMat];
  if(pl.gold < m.cost){ floater(bx.x, bx.y-8, 'NO GOLD', '#ff6b6b'); return; }
  pl.gold -= m.cost;
  pl.cells.set(k, {gx:c.gx, gy:c.gy, x:bx.x, y:bx.y, mat:curMat, hp:m.hp, max:m.hp, hit:0});
  SFX.place();
  if(tutorial) tutorial.note('place');
  refreshHUD();
}
function removeBlockAt(w){
  const pl = players.L;
  const c = cellAt(w.x, w.y);
  const k = key(c.gx,c.gy);
  if(pl.cells.has(k)){
    const b = pl.cells.get(k);
    pl.gold += Math.floor(MAT[b.mat].cost*0.7);
    pl.cells.delete(k);
    SFX.pick();
    refreshHUD();
  }
}

/* ============================================================= *
 *  FIRING
 * ============================================================= */
function fireFromAim(){
  if(shotsLeft<=0) return;
  const pl = players.L;
  let dx = aim.sx - aim.mx, dy = aim.sy - aim.my;   // slingshot: pull back, launch opposite
  let len = Math.hypot(dx,dy);
  if(len < 6) return;                                // tiny drag = cancel
  const pull = Math.min(len, MAXPULL);
  const a = AMMO[curAmmo];
  const speed = (2 + (pull/MAXPULL)*10) * a.spd;
  const ang = Math.atan2(dy, dx);
  pl.cannon.ang = ang*180/Math.PI;
  spawnBall(pl.side, pl.cannon.x, pl.cannon.y, Math.cos(ang)*speed, Math.sin(ang)*speed, curAmmo);
  shotsLeft--;
  SFX.fire(); shake = Math.max(shake,5);
  if(tutorial) tutorial.note('fire');
  refreshHUD();
}
function spawnBall(side, x, y, vx, vy, ammo){
  const a = AMMO[ammo];
  projectiles.push({side, x, y, vx, vy, g:CANNON_G, dmg:a.dmg, r:a.r, kind:'ball', ammo, split:a.split||0, boom:a.boom||0, life:600, trail:[]});
}

/* ============================================================= *
 *  AI
 * ============================================================= */
function aiSeedWall(){
  const pl = players.R;
  // a couple of starter stones in front of the king
  const baseGx = Math.floor((pl.king.x+40)/TILE);
  for(let dx=0; dx<2; dx++) for(let gy=0; gy<2; gy++){
    const gx = baseGx+dx; const b=blockXY(gx,gy);
    pl.cells.set(key(gx,gy), {gx,gy,x:b.x,y:b.y,mat:'stone',hp:MAT.stone.hp,max:MAT.stone.hp,hit:0});
  }
}
function aiBuildPhase(){
  const pl = players.R;
  const diff = Math.min(1.6, 0.8 + round*0.18);   // ramps up
  let gold = pl.gold;
  // 1) build/repair a shielding wall directly in front of the king (toward player = left)
  const wallGx = Math.floor((pl.king.x - 26)/TILE);   // a column just left of the king
  const targetH = Math.min(5, 2 + Math.floor(round/1.5));
  for(let col=0; col<2 && gold>0; col++){
    const gx = wallGx - col;
    for(let gy=0; gy<targetH && gold>0; gy++){
      const k = key(gx,gy);
      if(pl.cells.has(k)) continue;
      const supported = gy===0 || pl.cells.has(key(gx,gy-1));
      if(!supported) break;
      // choose material by wealth
      const mat = gold>120?'iron':gold>50?'stone':'wood';
      if(gold < MAT[mat].cost) break;
      const b = blockXY(gx,gy);
      pl.cells.set(k, {gx,gy,x:b.x,y:b.y,mat,hp:MAT[mat].hp,max:MAT[mat].hp,hit:0});
      gold -= MAT[mat].cost;
    }
  }
  // 2) buy a balanced army with the rest
  pl.queue = [];
  const order = ['soldier','archer','knight','soldier','archer'];
  let i=0, guard=0;
  while(gold >= UNIT.soldier.cost && guard++<40){
    const t = order[i % order.length]; i++;
    if(gold >= UNIT[t].cost && Math.random() < 0.55+diff*0.2){ pl.queue.push(t); gold -= UNIT[t].cost; }
  }
  pl.gold = gold;
}
function aiBattle(){
  const pl = players.R;
  if(pl.cannonCD>0){ pl.cannonCD--; return; }
  if(pl.aiShots<=0){ pl.cannonCD = 60; return; }
  const diff = Math.min(1, 0.30 + round*0.08);   // weaker, more forgiving early rounds
  // choose a target: player king if reachable/exposed, else frontmost blocking wall, else lead a unit
  const enemy = players.L;
  let target = pickAITarget(enemy);
  if(!target) return;
  const shot = solveBallistic(pl.cannon.x, pl.cannon.y, target.x, target.y, diff);
  if(!shot) return;
  spawnBall(pl.side, pl.cannon.x, pl.cannon.y, shot.vx, shot.vy, target.ammo||'standard');
  shake=Math.max(shake,3);
  pl.aiShots--;
  pl.cannonCD = Math.floor(135 - diff*45);   // ~1.5s..3s between shots
}
function pickAITarget(enemy){
  // exposed king? (no block in the column band in front of king)
  const kc = cellAt(enemy.king.x, GROUND_Y-10);
  let blocked=false;
  for(let gx=kc.gx; gx<=kc.gx+2; gx++){ for(let gy=0;gy<2;gy++){ if(enemy.cells.has(key(gx,gy))) blocked=true; } }
  if(!blocked || Math.random()<0.12){
    return {x:enemy.king.x, y:GROUND_Y-16, ammo:'heavy'};
  }
  // else target the tallest front wall column
  let best=null;
  enemy.cells.forEach(b=>{
    if(!best || b.y < best.y || (b.x>best.x)) best=b;   // prefer higher / closer-to-front
  });
  if(best) return {x:best.x+8, y:best.y+8, ammo: Math.random()<0.4?'bomb':'standard'};
  // else a marching unit
  const tgt = units.find(u=>u.side==='L');
  if(tgt) return {x:tgt.x+tgt.dir*20, y:tgt.y, ammo:'cluster'};
  return null;
}
// simulate candidate shots, return the one that passes closest to target
function solveBallistic(x0,y0,tx,ty,diff){
  let best=null, bestErr=1e9;
  for(let speed=5; speed<=12.5; speed+=0.6){
    for(let deg=-12; deg>=-82; deg-=4){
      const a = deg*Math.PI/180; // negative = up, but enemy faces left so flip x
      const dirx = tx < x0 ? -1 : 1;
      let vx = Math.cos(a)*speed*dirx, vy = Math.sin(a)*speed;
      let px=x0, py=y0, vpy=vy, vpx=vx, err=1e9;
      for(let t=0;t<240;t++){
        px+=vpx; py+=vpy; vpy+=CANNON_G;
        const d = Math.hypot(px-tx, py-ty);
        if(d<err) err=d;
        if(py>GROUND_Y+4) break;
      }
      if(err<bestErr){ bestErr=err; best={vx,vy}; }
    }
  }
  if(!best) return null;
  // inaccuracy: worse AI scatters more
  const scatter = (1-diff)*0.16;
  best.vx *= 1 + (Math.random()*2-1)*scatter;
  best.vy *= 1 + (Math.random()*2-1)*scatter;
  return best;
}

/* ============================================================= *
 *  UPDATE
 * ============================================================= */
function update(){
  frame++;
  if(paused || state===ST.OVER || state===ST.TITLE) return;

  // phase timer
  if(slowmo>0) slowmo--;
  const tick = slowmo>0 ? 0.5 : 1;

  if(frame % 60 === 0){
    phaseTime -= 1;
    if(state===ST.BUILD && phaseTime<=0 && !tutorial) startBattle();
    refreshHUD();
  }

  // camera keyboard pan
  if(keys['a']||keys['arrowleft']) camTargetX -= 7;
  if(keys['d']||keys['arrowright']) camTargetX += 7;

  if(state===ST.BUILD){
    camTargetX = clampCam(players.L.king.x - VIEW_W/2 + 60);
  }

  if(state===ST.BATTLE){
    updateBattle(tick);
  }

  // camera smoothing
  camTargetX = clampCam(camTargetX);
  camX += (camTargetX - camX)*0.12;
  camX = clampCam(camX);

  // fx
  if(shake>0){ shake*=0.86; if(shake<0.3) shake=0; }
  if(flash>0) flash*=0.85;
  // king wobble decay
  for(const s of ['L','R']){ const k=players[s].king; if(k.shake>0) k.shake*=0.8; }

  // debris/particles
  updateDebris(tick); updateParticles(tick); updateFloaters(tick);

  if(tutorial) tutorial.update();
}

function updateBattle(tick){
  const L=players.L, R=players.R;
  // spawn scheduled units
  for(const pl of [L,R]){
    if(pl._toSpawn){
      pl._spawnFrame += tick;
      while(pl._toSpawn.length && pl._spawnFrame >= pl._toSpawn[0].at){
        spawnUnit(pl, pl._toSpawn.shift().type);
      }
    }
  }
  // AI cannon
  if(!tutorial) aiBattle();

  updateUnits(tick);
  updateProjectiles(tick);

  // follow action with camera
  const manualPan = keys['a']||keys['d']||keys['arrowleft']||keys['arrowright'];
  if(!manualPan){
    if(aim.active){
      // while aiming, frame the cannon (~30% from the left) so the arc is visible
      camTargetX = clampCam(players.L.cannon.x - VIEW_W*0.30);
    } else {
      const focus = battleFocus();
      if(focus!=null) camTargetX = clampCam(focus - VIEW_W/2);
    }
  }

  // end conditions
  if(tutorial) return;
  const noUnits = units.length===0 && (!L._toSpawn||L._toSpawn.length===0) && (!R._toSpawn||R._toSpawn.length===0);
  const noBalls = projectiles.every(p=>p.kind!=='ball');
  const noOffense = shotsLeft===0 && R.aiShots<=0;
  if(phaseTime<=0 && noBalls){ endBattle(); }
  else if(noUnits && noBalls && noOffense && phaseTime < BATTLE_TIME-4){ endBattle(); }
}

function battleFocus(){
  // 1) follow the player's airborne cannonball
  const ball = projectiles.find(p=>p.kind==='ball' && p.side==='L');
  if(ball) return ball.x;
  // 2) cut to the frontline only once the two armies actually meet
  let lMax=-1, rMin=WORLD_W+1;
  for(const u of units){ if(u.side==='L') lMax=Math.max(lMax,u.x); else rMin=Math.min(rMin,u.x); }
  if(lMax>0 && rMin<WORLD_W && (rMin-lMax) < VIEW_W*0.6) return (lMax+rMin)/2;
  // 3) otherwise keep the player's cannon in view so they can line up a shot
  return players.L.cannon.x + VIEW_W*0.20;
}

/* ---------- Units ---------- */
function enemyOf(side){ return side==='L'?'R':'L'; }
function updateUnits(tick){
  for(const u of units){
    if(u.hp<=0) continue;
    const cfg = UNIT[u.type];
    const foeSide = enemyOf(u.side);
    const foePl = players[foeSide];
    u.cd -= tick;

    // 1) nearest enemy unit
    let foe=null, foeDist=1e9;
    const reach = cfg.rng>0 ? cfg.rng : cfg.melee;
    for(const o of units){
      if(o.side===u.side || o.hp<=0) continue;
      const d=Math.abs(o.x-u.x);
      if(d<foeDist){ foeDist=d; foe=o; }
    }
    let acted=false;
    if(foe && foeDist <= reach + 2){
      // archers keep distance & shoot, melee bonk
      if(cfg.rng>0){
        if(u.cd<=0){ shootArrow(u, foe.x, foe.y - 4); u.cd=cfg.cd; }
        u.state='shoot';
      } else {
        if(u.cd<=0){ damageUnit(foe, cfg.dmg, u.dir); u.cd=cfg.cd; flashHit(foe.x,foe.y); }
        u.state='fight';
      }
      acted=true;
    }
    if(!acted){
      // 2) wall in front?
      const frontX = u.x + u.dir*(cfg.w/2+3);
      const fc = cellAt(frontX, GROUND_Y-8);
      let blk=null;
      for(let gy=0; gy<2; gy++){ const b=foePl.cells.get(key(fc.gx,gy)); if(b){ blk=b; break; } }
      if(blk){
        if(u.cd<=0){ damageBlock(foePl, blk, cfg.dmg*1.4); u.cd=cfg.cd; }
        u.state='siege';
        acted=true;
      }
    }
    if(!acted){
      // 3) reached enemy king?
      if(Math.abs(u.x - foePl.king.x) < 18){
        if(u.cd<=0){ damageKing(foePl, cfg.dmg, u.dir); u.cd=cfg.cd; }
        u.state='king';
        acted=true;
      }
    }
    if(!acted){
      // march
      u.x += u.dir * cfg.spd * tick;
      u.state='march';
      u.anim += tick*0.25;
    }
    // clamp inside world
    u.x = Math.max(20, Math.min(WORLD_W-20, u.x));
  }
  // cull dead
  units = units.filter(u=>u.hp>0);
}
function shootArrow(u, tx, ty){
  const dx=tx-u.x, dy=ty-(u.y+4);
  const d=Math.max(1,Math.hypot(dx,dy));
  const sp=4.2;
  projectiles.push({side:u.side, x:u.x+u.dir*6, y:u.y+4, vx:dx/d*sp, vy:dy/d*sp - 0.6, g:0.05, dmg:UNIT.archer.dmg, r:2, kind:'arrow', life:140, trail:[]});
  SFX.arrow();
}
function damageUnit(u, dmg, dir){
  u.hp -= dmg; u.knock=(u.knock||0)+dir*0.6;
  if(u.hp<=0){ burst(u.x,u.y-6, '#d8d0c0', 8); SFX.hit(); }
}
function damageBlock(pl, b, dmg){
  b.hp -= dmg; b.hit=6;
  burst(b.x+8,b.y+8, MAT[b.mat].edge, 3);
  if(b.hp<=0){ pl.cells.delete(key(b.gx,b.gy)); destroyBlockFx(b); }
}
function destroyBlockFx(b){
  const m=MAT[b.mat];
  for(let i=0;i<5;i++) debris.push({x:b.x+4+Math.random()*8, y:b.y+4+Math.random()*8, vx:(Math.random()*2-1)*2.4, vy:-Math.random()*3-1, rot:Math.random()*6, vr:(Math.random()*2-1)*0.3, s:3+Math.random()*4, col:Math.random()<0.5?m.col:m.col2, life:90});
  burst(b.x+8,b.y+8, m.edge, 10);
  shake=Math.max(shake,4); SFX.destroy();
}
function damageKing(pl, dmg, dir){
  pl.king.hp -= dmg; pl.king.shake=6;
  flashHit(pl.king.x, GROUND_Y-30);
  floater(pl.king.x, GROUND_Y-58, '-'+Math.round(dmg), '#ff6b6b');
  if(pl.king.hp<=0){ pl.king.hp=0; victory(pl.side==='R'?'L':'R'); }
}

/* ---------- Projectiles ---------- */
function updateProjectiles(tick){
  const keep=[];
  for(const p of projectiles){
    p.life-=tick; if(p.life<=0) continue;
    const speed=Math.hypot(p.vx,p.vy);
    const steps=Math.max(1, Math.ceil(speed/4));
    let dead=false;
    p.trail.push({x:p.x,y:p.y}); if(p.trail.length>8) p.trail.shift();
    for(let s=0;s<steps && !dead;s++){
      p.x += p.vx/steps; p.y += p.vy/steps;
      if(collideProjectile(p)){ dead=true; }
    }
    p.vy += p.g*tick;
    // hit ground
    if(!dead && p.y >= GROUND_Y-1){
      onProjectileImpact(p, p.x, GROUND_Y-1, null);
      dead=true;
    }
    if(p.x< -40 || p.x>WORLD_W+40) dead=true;
    // cluster split at apex
    if(!dead && p.split>0 && p.vy>0 && !p.didSplit){
      p.didSplit=true;
      for(let i=-1;i<=1;i++){ if(i===0) continue;
        projectiles.push({side:p.side,x:p.x,y:p.y,vx:p.vx+i*1.8,vy:p.vy*0.8,g:p.g,dmg:p.dmg,r:p.r,kind:'ball',ammo:'standard',split:0,boom:0,life:400,trail:[]});
      }
    }
    if(!dead) keep.push(p);
  }
  projectiles = keep;
}
function collideProjectile(p){
  const foe = enemyOf(p.side);
  const foePl = players[foe];
  // king
  const k=foePl.king;
  if(k.hp>0 && Math.abs(p.x-k.x)<12 && p.y>GROUND_Y-34 && p.y<GROUND_Y){
    damageKing(foePl, p.dmg, Math.sign(p.vx)||1);
    onProjectileImpact(p,p.x,p.y,'king');
    return true;
  }
  // blocks
  const c=cellAt(p.x,p.y);
  for(let gy=Math.max(0,c.gy-0); gy>=0 && gy<=c.gy; gy--){}
  const b=foePl.cells.get(key(c.gx,c.gy));
  if(b){
    damageBlock(foePl, b, p.dmg);
    onProjectileImpact(p,p.x,p.y,'block');
    return true;
  }
  // enemy units
  for(const u of units){
    if(u.side===p.side||u.hp<=0) continue;
    const cfg=UNIT[u.type];
    if(p.x>u.x-cfg.w/2 && p.x<u.x+cfg.w/2 && p.y>u.y && p.y<u.y+cfg.h){
      damageUnit(u, p.dmg, Math.sign(p.vx)||1);
      onProjectileImpact(p,p.x,p.y,'unit');
      return true;
    }
  }
  return false;
}
function onProjectileImpact(p, x, y, what){
  if(p.kind==='arrow'){ burst(x,y,'#cfc0a0',3); return; }
  burst(x,y,'#ffd23f',10); shake=Math.max(shake, p.r*1.6);
  if(p.boom>0){ explode(p.side, x, y, p.boom, p.dmg*0.8); flash=0.5; }
}
function explode(side, x, y, radius, dmg){
  const foe=enemyOf(side); const foePl=players[foe];
  burst(x,y,'#ff7a2a',22); SFX.destroy();
  // blocks
  foePl.cells.forEach(b=>{
    const d=Math.hypot(b.x+8-x, b.y+8-y);
    if(d<radius) damageBlock(foePl, b, dmg*(1-d/radius));
  });
  // units
  for(const u of units){ if(u.side===side) continue;
    const d=Math.hypot(u.x-x, u.y-y);
    if(d<radius){ damageUnit(u, dmg*(1-d/radius), Math.sign(u.x-x)||1); u.knock=(u.knock||0)+(u.x>x?1:-1)*2; }
  }
  // king
  const k=foePl.king; const d=Math.hypot(k.x-x, (GROUND_Y-16)-y);
  if(d<radius && k.hp>0) damageKing(foePl, dmg*(1-d/radius), Math.sign(k.x-x)||1);
}

/* ---------- FX ---------- */
function burst(x,y,col,n){ for(let i=0;i<n;i++){ const a=Math.random()*6.28, s=1+Math.random()*3; particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:18+Math.random()*14,col,s:1+Math.random()*2}); } }
function flashHit(x,y){ burst(x,y,'#ffffff',6); }
function floater(x,y,txt,col){ floaters.push({x,y,txt,col,life:50,vy:-0.5}); }
function banner(h,p){ const b=document.getElementById('banner'); document.getElementById('bannerH').textContent=h; document.getElementById('bannerP').textContent=p||''; b.classList.add('show'); clearTimeout(banner._t); banner._t=setTimeout(()=>b.classList.remove('show'),1400); }
function updateDebris(t){ for(const d of debris){ d.x+=d.vx*t; d.y+=d.vy*t; d.vy+=DEBRIS_G*t; d.rot+=d.vr*t; d.life-=t; if(d.y>GROUND_Y-d.s){ d.y=GROUND_Y-d.s; d.vy*=-0.32; d.vx*=0.7; } } debris=debris.filter(d=>d.life>0); }
function updateParticles(t){ for(const p of particles){ p.x+=p.vx*t; p.y+=p.vy*t; p.vy+=0.16*t; p.life-=t; } particles=particles.filter(p=>p.life>0); }
function updateFloaters(t){ for(const f of floaters){ f.y+=f.vy*t; f.life-=t; } floaters=floaters.filter(f=>f.life>0); }

/* ============================================================= *
 *  VICTORY
 * ============================================================= */
function victory(winnerSide){
  state = ST.OVER;
  showBar(null);
  const win = winnerSide==='L';
  if(win) SFX.win(); else SFX.lose();
  document.getElementById('over').classList.add('show');
  const h=document.getElementById('overH'), p=document.getElementById('overP');
  h.textContent = win?'🎉 VICTORY!':'💀 DEFEAT';
  h.style.color = win?'#36e07a':'#ff5050';
  p.textContent = win
    ? 'The Celtic Corgis crushed the Viking Laikas after '+round+' rounds!'
    : 'The Viking Laikas overran your castle. Try a stronger wall!';
}

/* ============================================================= *
 *  RENDER
 * ============================================================= */
function clampCam(x){ return Math.max(0, Math.min(WORLD_W-VIEW_W, x)); }

function render(){
  g.save();
  // background (does not scroll with full parallax — drawn in screen space then world layered)
  drawSky();
  // shake
  let shx=0, shy=0;
  if(shake>0){ shx=(Math.random()-0.5)*shake; shy=(Math.random()-0.5)*shake; }
  g.translate(-Math.round(camX)+shx, shy);

  drawParallax();
  drawGround();
  drawRuins();

  // build zone highlight
  if(state===ST.BUILD){ drawZone(players.L); }

  // blocks
  drawBlocks(players.R);
  drawBlocks(players.L);

  // cannons + kings + units
  drawKing(players.R);
  drawKing(players.L);
  drawCannon(players.R, false);
  drawCannon(players.L, true);

  // sort units by x for slight depth, draw
  const su=[...units].sort((a,b)=>a.y-b.y);
  for(const u of su) drawUnit(u);

  drawDebris();
  drawProjectiles();
  drawParticles();
  drawFloaters();

  // build hover preview
  if(state===ST.BUILD && hoverCell) drawHoverGhost();

  // aim trajectory
  if(state===ST.BATTLE) drawAim();

  g.restore();

  // screen-space flash
  if(flash>0.02){ g.fillStyle='rgba(255,240,180,'+Math.min(0.6,flash)+')'; g.fillRect(0,0,VIEW_W,VIEW_H); }

  // vignette
  drawVignette();

  // blit to display, scaled
  sx.fillStyle='#05070d'; sx.fillRect(0,0,screen.width,screen.height);
  sx.imageSmoothingEnabled=false;
  sx.drawImage(buf, 0,0,VIEW_W,VIEW_H, offX,offY, VIEW_W*scale, VIEW_H*scale);

  if(paused) drawPaused();
}

function drawSky(){
  const grd=g.createLinearGradient(0,0,0,GROUND_Y);
  grd.addColorStop(0,'#243b6e');
  grd.addColorStop(0.45,'#3f6aa8');
  grd.addColorStop(0.8,'#7aa6d6');
  grd.addColorStop(1,'#b9d9ea');
  g.fillStyle=grd; g.fillRect(0,0,VIEW_W,GROUND_Y+2);
  // sun
  g.fillStyle='#ffe9a8'; g.fillRect(VIEW_W-72,26,26,26);
  g.fillStyle='rgba(255,233,168,0.3)'; g.fillRect(VIEW_W-78,20,38,38);
}
function drawParallax(){
  // far mountains (slow)
  const px = camX*0.3;
  g.fillStyle='#3a4f7a';
  for(let i=-1;i<8;i++){ const bx=i*180 - (px%180); mountain(bx, GROUND_Y-10, 150, 78); }
  g.fillStyle='#4a628f';
  for(let i=-1;i<10;i++){ const bx=i*140 - (camX*0.5%140); mountain(bx, GROUND_Y-6, 120, 54); }
  // clouds
  g.fillStyle='rgba(255,255,255,0.78)';
  const cl=[[60,38],[220,58],[360,30],[150,80],[420,70]];
  for(const [cx,cy] of cl){ const x=((cx - camX*0.25)%(VIEW_W+80)+VIEW_W+80)%(VIEW_W+80)-40; cloud(x+camX, cy); }
  // tree line (mid)
  g.fillStyle='#27613a';
  for(let i=-1;i<22;i++){ const bx=i*60 - (camX*0.8%60); tree(bx+camX, GROUND_Y-2, 0.8); }
}
function mountain(x,baseY,w,h){ g.beginPath(); g.moveTo(x,baseY); g.lineTo(x+w/2,baseY-h); g.lineTo(x+w,baseY); g.closePath(); g.fill(); }
function cloud(x,y){ g.fillRect(x,y,28,9); g.fillRect(x+6,y-6,18,9); g.fillRect(x+14,y,22,9); }
function tree(x,y,s){ g.fillRect(x+6*s,y-14*s,3,14*s); g.fillStyle='#2f7a47'; g.fillRect(x,y-26*s,16*s,16*s); g.fillRect(x+3*s,y-32*s,10*s,8*s); g.fillStyle='#27613a'; }

function drawGround(){
  g.fillStyle='#4f8a3a'; g.fillRect(0,GROUND_Y,WORLD_W,6);          // grass top
  g.fillStyle='#3c6b2c'; g.fillRect(0,GROUND_Y+6,WORLD_W,6);
  g.fillStyle='#6b4a2a'; g.fillRect(0,GROUND_Y+12,WORLD_W,VIEW_H);   // dirt
  g.fillStyle='#5a3d22';
  for(let x=0;x<WORLD_W;x+=18){ g.fillRect(x,GROUND_Y+18,10,5); g.fillRect(x+6,GROUND_Y+28,8,5); g.fillRect(x+2,GROUND_Y+40,7,5); }
  // grass blades
  g.fillStyle='#5fa047';

function drawBlocks(pl){ pl.cells.forEach(b=>drawBlock(b)); }
function drawBlock(b){
  const m=MAT[b.mat];
  const x=Math.round(b.x), y=Math.round(b.y);
  g.fillStyle=m.col; g.fillRect(x,y,TILE,TILE);
  g.fillStyle=m.col2;
  for(let py=0;py<TILE;py+=4) for(let px=0;px<TILE;px+=4){ if((px+py)%8===0) g.fillRect(x+px,y+py,4,4); }
  g.fillStyle=m.edge; g.fillRect(x,y,TILE,2); g.fillRect(x,y,2,TILE);
  g.fillStyle='rgba(0,0,0,0.32)'; g.fillRect(x,y+TILE-2,TILE,2); g.fillRect(x+TILE-2,y,2,TILE);
  if(b.hit>0){ g.fillStyle='rgba(255,255,255,'+(b.hit/12)+')'; g.fillRect(x,y,TILE,TILE); b.hit--; }
  // damage cracks / health
  if(b.hp<b.max){
    const f=b.hp/b.max;
    g.fillStyle='#1a1a1a';
    if(f<0.66){ g.fillRect(x+4,y+2,1,8); g.fillRect(x+5,y+8,3,1); }
    if(f<0.33){ g.fillRect(x+10,y+5,1,7); g.fillRect(x+8,y+9,3,1); }
    // hp pip bar
    g.fillStyle='#000'; g.fillRect(x,y-3,TILE,2);
    g.fillStyle=f>0.5?'#36e07a':f>0.25?'#ffd23f':'#ff5050'; g.fillRect(x,y-3,Math.ceil(TILE*f),2);
  }
}

function drawHoverGhost(){
  const c=hoverCell; if(c.gy<0||c.gy>9) return;
  const b=blockXY(c.gx,c.gy);
  const pl=players.L;
  const k=key(c.gx,c.gy);
  const exists=pl.cells.has(k);
  const inz=inZone(pl,b.x+TILE/2);
  const supported=c.gy===0||pl.cells.has(key(c.gx,c.gy-1));
  const ok=inz&&supported&&!exists&&pl.gold>=MAT[curMat].cost;
  g.globalAlpha=0.6;
  g.fillStyle= exists?'#ff5050': ok?MAT[curMat].col:'#aa4444';
  g.fillRect(b.x,b.y,TILE,TILE);
  g.globalAlpha=1;
  g.strokeStyle= exists?'#ff5050': ok?'#36e07a':'#ff8030'; g.lineWidth=1;
  g.strokeRect(b.x+0.5,b.y+0.5,TILE-1,TILE-1);
}

/* ----- Kings (pixel dogs) ----- */

  // tail
  g.fillStyle=body; g.fillRect(10,-22,5,5);
  // head
  g.fillStyle=body; g.fillRect(-10,-40,20,18);
  // snout
  g.fillStyle=body2; g.fillRect(2,-30,9,7);
  g.fillStyle='#000'; g.fillRect(9,-29,2,2); // nose

  if(isCorgi){ g.fillRect(-10,-48,6,9); g.fillRect(4,-48,6,9); }
  else { g.beginPath(); g.moveTo(-9,-40); g.lineTo(-6,-50); g.lineTo(-2,-40); g.fill(); g.beginPath(); g.moveTo(2,-40); g.lineTo(5,-50); g.lineTo(9,-40); g.fill(); }

function drawBar(x,y,w,h,f){
  f=Math.max(0,Math.min(1,f));
  g.fillStyle='#000'; g.fillRect(x-1,y-1,w+2,h+2);
  g.fillStyle='#3a2a2a'; g.fillRect(x,y,w,h);
  g.fillStyle=f>0.5?'#36e07a':f>0.25?'#ffd23f':'#ff5050';
  g.fillRect(x,y,Math.round(w*f),h);
  g.fillStyle='rgba(255,255,255,0.25)'; g.fillRect(x,y,Math.round(w*f),1);
}

/* ----- Units ----- */
function drawUnit(u){
  const cfg=UNIT[u.type];
  const isL=u.side==='L';
  const x=Math.round(u.x + (u.knock||0)), y=Math.round(u.y);
  const bob = u.state==='march' ? Math.round(Math.sin(u.anim)* (u.type==='knight'?0:1)) : 0;
  g.save(); g.translate(x, y+bob);
  g.scale(u.dir,1);
  // shadow
  g.fillStyle='rgba(0,0,0,0.25)'; g.fillRect(-cfg.w/2, cfg.h-bob, cfg.w, 2);
  const main = isL? '#c75a2a' : '#3f6f9c';
  const skin = isL? '#e8b07a' : '#cdd6e0';
  const trim = isL? '#2ca84a' : '#9fb8d8';
  if(u.type==='soldier'){
    g.fillStyle=main; g.fillRect(-4,-2,8,11);             // body
    g.fillStyle=skin; g.fillRect(-3,-9,6,6);              // head
    g.fillStyle=trim; g.fillRect(-4,-11,8,3);             // helm
    g.fillStyle='#6b6b6b'; g.fillRect(5,-12,2,18);        // spear
    g.fillStyle='#cfcfcf'; g.fillRect(4,-14,3,4);         // spear tip
    g.fillStyle='#7a4a2a'; g.fillRect(-7,-4,3,7);         // shield arm
    g.fillStyle=trim; g.fillRect(-8,-3,3,6);              // shield
  } else if(u.type==='archer'){
    g.fillStyle=main; g.fillRect(-3,-2,7,11);
    g.fillStyle=skin; g.fillRect(-3,-9,6,6);
    g.fillStyle='#3a6b2a'; g.fillRect(-4,-11,7,3);        // hood
    g.strokeStyle='#7a4a2a'; g.lineWidth=1;               // bow
    g.beginPath(); g.arc(4,-2,6,-1.2,1.2); g.stroke();
    g.strokeStyle='#ddd'; g.beginPath(); g.moveTo(4,-8); g.lineTo(4,4); g.stroke();
  } else { // knight
    g.fillStyle='#8a93a3'; g.fillRect(-5,-3,10,13);       // armor
    g.fillStyle=main; g.fillRect(-5,-3,3,13);
    g.fillStyle='#aab4c4'; g.fillRect(-4,-11,8,8);        // helm
    g.fillStyle='#000'; g.fillRect(0,-9,3,2);             // visor
    g.fillStyle=trim; g.fillRect(-3,-15,3,5);             // plume
    g.fillStyle='#6b6b6b'; g.fillRect(6,-14,2,20);        // sword
    g.fillStyle='#d8d8d8'; g.fillRect(5,-16,4,3);
  }
  // attack lunge flash
  if((u.state==='fight'||u.state==='siege'||u.state==='king') && u.cd>cfg.cd-6){
    g.fillStyle='rgba(255,255,255,0.5)'; g.fillRect(4,-12,6,4);
  }
  g.restore();
  // hp bar (small)
  if(u.hp<u.max){ drawBar(x-cfg.w/2, y-5, cfg.w, 2, u.hp/u.max); }
}

function drawDebris(){
  for(const d of debris){ g.save(); g.translate(d.x,d.y); g.rotate(d.rot); g.fillStyle=d.col; g.fillRect(-d.s/2,-d.s/2,d.s,d.s); g.restore(); }
}
function drawProjectiles(){
  for(const p of projectiles){
    if(p.kind==='arrow'){
      g.strokeStyle='#5a3a1a'; g.lineWidth=1;
      g.beginPath(); g.moveTo(p.x,p.y); g.lineTo(p.x-p.vx,p.y-p.vy); g.stroke();
      g.fillStyle='#cfcfcf'; g.fillRect(Math.round(p.x),Math.round(p.y),2,2);
      continue;
    }
    // trail
    for(let i=0;i<p.trail.length;i++){ const t=p.trail[i]; g.fillStyle='rgba(255,210,80,'+(i/p.trail.length*0.5)+')'; const s=Math.max(1,p.r-1); g.fillRect(Math.round(t.x-s/2),Math.round(t.y-s/2),s,s); }
    const col = p.ammo==='bomb'?'#ff5a2a':p.ammo==='heavy'?'#2c3340':p.ammo==='cluster'?'#ff7ab0':'#3a2a18';
    g.fillStyle=col; g.fillRect(Math.round(p.x-p.r),Math.round(p.y-p.r),p.r*2,p.r*2);
    g.fillStyle='rgba(255,255,255,0.6)'; g.fillRect(Math.round(p.x-p.r+1),Math.round(p.y-p.r+1),2,2);
    if(p.ammo==='bomb'){ g.fillStyle='#ffcf00'; g.fillRect(Math.round(p.x),Math.round(p.y-p.r-2),1,2); }
  }
}
function drawParticles(){ for(const p of particles){ g.globalAlpha=Math.max(0,Math.min(1,p.life/20)); g.fillStyle=p.col; g.fillRect(Math.round(p.x),Math.round(p.y),p.s,p.s); } g.globalAlpha=1; }
function drawFloaters(){ for(const f of floaters){ g.globalAlpha=Math.max(0,f.life/40); pxText(f.txt, Math.round(f.x), Math.round(f.y), f.col); } g.globalAlpha=1; }

function drawAim(){
  const pl=players.L;
  if(!aim.active){
    // idle: draw a subtle reticle toward mouse
    return;
  }
  let dx=aim.sx-aim.mx, dy=aim.sy-aim.my;
  let len=Math.hypot(dx,dy); if(len<6) return;
  const pull=Math.min(len,MAXPULL);
  const a=AMMO[curAmmo];
  const speed=(2+(pull/MAXPULL)*10)*a.spd;
  const ang=Math.atan2(dy,dx);
  let tx=pl.cannon.x, ty=pl.cannon.y, vx=Math.cos(ang)*speed, vy=Math.sin(ang)*speed;
  // power meter color
  const pw=pull/MAXPULL;
  for(let i=0;i<70;i++){
    tx+=vx; ty+=vy; vy+=CANNON_G;
    if(ty>GROUND_Y||tx<0||tx>WORLD_W) break;
    if(i%3===0){ const s=i<24?2:1; g.fillStyle= pw>0.85?'#ff5050':'rgba(255,255,255,0.85)'; g.fillRect(Math.round(tx),Math.round(ty),s,s); }
  }
  // power bar near cannon
  drawBar(pl.cannon.x-16, pl.cannon.y-44, 32, 4, pw);
}

/* ============================================================= *
 *  TUTORIAL
 * ============================================================= */
function makeTutorial(){
  const steps=[
    {phase:'build', msg:"Welcome, Commander! This is your CORGI KING. If his health reaches zero, you lose. Let's defend him.", wait:'next'},
    {phase:'build', msg:"BUILD a wall! Click inside the green zone to place blocks. Stack them in FRONT of your king. Place at least 4.", wait:()=> placedCount()>=4},
    {phase:'build', msg:"Nice wall! Pick a tougher material from the bar (STONE/IRON) any time. Right-click removes a block for a refund.", wait:'next'},
    {phase:'build', msg:"An army wins sieges. Buy a SOLDIER and an ARCHER from the bar — they'll march out when battle starts.", wait:()=> players.L.queue.length>=2},
    {phase:'build', msg:"Ready? Hit ⚔ DONE — FIGHT! (or press SPACE) to begin the battle.", wait:'phase:battle'},
    {phase:'battle', msg:"BATTLE! DRAG anywhere and pull BACK like a slingshot — the dotted arc shows your shot. RELEASE to fire at the enemy. Try it!", wait:()=> tutorial.fired>=1},
    {phase:'battle', msg:"Great shot! You have limited shots per battle, so aim well. Switch AMMO (HEAVY/CLUSTER/BOMB) in the bar for different effects.", wait:'next'},
    {phase:'battle', msg:"Your units fight automatically. Destroy the enemy LAIKA KING to win the war. Use A/D or ARROWS to pan the camera. Good luck!", wait:'next', last:true},
  ];
  let i=0; let firedCount=0;
  function show(){
    const s=steps[i];
    const box=document.getElementById('tut');
    document.getElementById('tutMsg').textContent=s.msg;
    box.classList.add('show');
    const nx=document.getElementById('tutNext');
    nx.style.display = (s.wait==='next') ? 'inline-block':'none';
  }
  return {
    fired:0,
    start(){ i=0; show(); },
    note(ev){ if(ev==='fire'){ this.fired++; firedCount++; } },
    onPhase(ph){ const s=steps[i]; if(!s) return; if(typeof s.wait==='string' && s.wait==='phase:'+ph){ this.advance(); } },
    next(){ const s=steps[i]; if(s && s.wait==='next') this.advance(); },
    advance(){
      i++;
      if(i>=steps.length){ document.getElementById('tut').classList.remove('show'); tutorial=null; banner('TUTORIAL DONE','Now fight for real!'); return; }
      const s=steps[i];
      if(s.phase==='battle' && state!==ST.BATTLE){ /* will show when phase matches */ }
      show();
    },
    update(){
      const s=steps[i]; if(!s) return;
      if(typeof s.wait==='function' && s.wait()){ this.advance(); }
    }
  };
}
function placedCount(){ return players.L.cells.size; }

function refreshHUD(){
  if(!players) return;
  document.getElementById('hudGold').textContent='💰 '+players.L.gold;
  document.getElementById('hudRound').textContent='ROUND '+round;
  document.getElementById('hudPhase').textContent = state===ST.BUILD?'BUILD':'BATTLE';
  document.getElementById('hudTimer').textContent = tutorial?'⏱ —':('⏱ '+Math.max(0,phaseTime|0));
  // shots
  let pips=''; for(let i=0;i<SHOTS_PER_BATTLE;i++) pips+= i<shotsLeft?'●':'○';
  document.getElementById('shotsLeft').textContent=pips;
  refreshMatUI();
}
function refreshMatUI(){
  // lock unaffordable
  if(!players) return;
  document.querySelectorAll('.matbtn').forEach(b=>{
    const m=MAT[b.dataset.mat]; b.classList.toggle('lock', players.L.gold<m.cost);
  });
  document.querySelectorAll('.unitbtn').forEach(b=>{
    const u=UNIT[b.dataset.unit]; b.classList.toggle('lock', players.L.gold<u.cost);
  });
}

}));
document.querySelectorAll('.ammobtn').forEach(b=>b.addEventListener('click',()=>{

document.getElementById('playBtn').addEventListener('click', ()=>{ ac(); startGame(false); if(tutorial)tutorial.start(); });
document.getElementById('tutBtn').addEventListener('click', ()=>{ ac(); startGame(true); tutorial.start(); });
document.getElementById('againBtn').addEventListener('click', ()=>{ startGame(false); });

function backToTitle(){
  state=ST.TITLE; players=null; tutorial=null; units=[]; projectiles=[]; debris=[]; particles=[];
  document.getElementById('title').classList.remove('hide');
  document.getElementById('hud').classList.remove('show');
  document.getElementById('over').classList.remove('show');
  showBar(null);
  document.getElementById('tut').classList.remove('show');
}

/* ============================================================= *
 *  TITLE BACKGROUND (animated demo)
 * ============================================================= */
function renderTitle(){
  drawSky();
  drawParallax();
  drawGround();
  drawRuins();
  // a couple of idle dog kings waving
  const fakeL={isL:true,king:{x:120,hp:100,max:100,shake:0},cannon:{x:42,y:GROUND_Y-30,ang:-40}};
  const fakeR={isL:false,king:{x:WORLD_W-120,hp:100,max:100,shake:0},cannon:{x:WORLD_W-42,y:GROUND_Y-30,ang:-140}};
  // dim, since HTML title overlays
  drawCannon(fakeR,false); drawCannon(fakeL,true);
  // floating cannonballs arc for flavor
  const t=frame*0.04;
  for(let i=0;i<3;i++){ const px=120+(i*120), tt=(t+i)%6.28; const bx=px+tt*30, by=GROUND_Y-30-Math.sin(tt)*70; g.fillStyle='#3a2a18'; g.fillRect(bx,by,4,4); }
  g.globalAlpha=0.5; drawKingSimple(fakeL); drawKingSimple(fakeR); g.globalAlpha=1;
  drawVignette();
  sx.fillStyle='#05070d'; sx.fillRect(0,0,screen.width,screen.height);
  sx.imageSmoothingEnabled=false;
  sx.drawImage(buf,0,0,VIEW_W,VIEW_H, offX,offY, VIEW_W*scale, VIEW_H*scale);
}
function drawKingSimple(pl){ const sv=players; players={L:pl,R:pl}; try{ drawKing(pl);}catch(e){} players=sv; }

/* ============================================================= *
 *  MAIN LOOP (fixed timestep)
 * ============================================================= */
let acc=0, last=performance.now();
const STEP=1000/60;
function loop(now){
  let dt=now-last; last=now; if(dt>100) dt=100; acc+=dt;
  let guard=0;
  while(acc>=STEP && guard++<5){ update(); acc-=STEP; }
  if(state===ST.TITLE){ frame++; renderTitle(); }
  else render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* expose for debugging */
window.SPITZ={get state(){return state;}, players:()=>players};
</script>
