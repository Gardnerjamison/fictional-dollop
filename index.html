<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Warhammer Mini Tracker</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --surface2: #242424;
      --border: #333;
      --accent: #c0392b;
      --accent2: #e74c3c;
      --gold: #d4a017;
      --text: #e8e8e8;
      --muted: #888;
      --unpainted: #555;
      --primed: #7f8c8d;
      --wip: #e67e22;
      --done: #27ae60;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, #1a0000, #2d0a0a);
      border-bottom: 2px solid var(--accent);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    header h1 {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--gold);
      letter-spacing: 1px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    header h1 span { color: var(--accent2); }

    .header-actions { display: flex; gap: 8px; }

    button {
      cursor: pointer;
      border: none;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 8px 14px;
      transition: background 0.15s, transform 0.1s;
    }
    button:active { transform: scale(0.97); }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:hover { background: var(--accent2); }

    .btn-secondary {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover { background: #2e2e2e; }

    .btn-danger {
      background: transparent;
      color: #e74c3c;
      border: 1px solid #e74c3c44;
      padding: 5px 10px;
      font-size: 0.8rem;
    }
    .btn-danger:hover { background: #e74c3c22; }

    .btn-edit {
      background: transparent;
      color: var(--gold);
      border: 1px solid #d4a01744;
      padding: 5px 10px;
      font-size: 0.8rem;
    }
    .btn-edit:hover { background: #d4a01722; }

    main { max-width: 900px; margin: 0 auto; padding: 20px 16px; }

    /* Stats bar */
    .stats {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .stat-chip {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 5px 14px;
      font-size: 0.82rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .stat-chip .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* Filters */
    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 16px;
      align-items: center;
    }
    .filters input[type="text"] {
      flex: 1;
      min-width: 140px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      padding: 8px 12px;
      font-size: 0.9rem;
    }
    .filters input[type="text"]:focus { outline: none; border-color: var(--accent); }

    select {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      padding: 8px 10px;
      font-size: 0.85rem;
      cursor: pointer;
    }
    select:focus { outline: none; border-color: var(--accent); }

    /* Mini cards grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 12px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: border-color 0.2s;
    }
    .card:hover { border-color: #555; }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }

    .card-name {
      font-weight: 700;
      font-size: 1rem;
      color: var(--text);
      line-height: 1.3;
    }

    .card-qty {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2px 9px;
      font-size: 0.78rem;
      color: var(--muted);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .card-faction {
      font-size: 0.8rem;
      color: var(--gold);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .card-meta {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }

    .status-badge {
      border-radius: 12px;
      padding: 3px 10px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .status-unpainted { background: #55555533; color: #aaa; border: 1px solid #555; }
    .status-primed    { background: #7f8c8d33; color: #aaa; border: 1px solid #7f8c8d; }
    .status-wip       { background: #e67e2233; color: #e67e22; border: 1px solid #e67e22; }
    .status-done      { background: #27ae6033; color: #27ae60; border: 1px solid #27ae60; }

    .card-points {
      font-size: 0.78rem;
      color: var(--muted);
    }
    .card-points span { color: var(--text); font-weight: 600; }

    .card-notes {
      font-size: 0.82rem;
      color: var(--muted);
      font-style: italic;
      border-top: 1px solid var(--border);
      padding-top: 8px;
    }

    .card-actions {
      display: flex;
      gap: 6px;
      margin-top: 4px;
    }

    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }
    .empty p:first-child { font-size: 2.5rem; margin-bottom: 10px; }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: #000000bb;
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-overlay.open { display: flex; }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      width: 100%;
      max-width: 460px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal h2 {
      font-size: 1.1rem;
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 20px;
    }

    .form-row {
      display: flex;
      gap: 10px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-bottom: 14px;
      flex: 1;
    }

    label {
      font-size: 0.8rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input[type="text"], input[type="number"], textarea, .modal select {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      padding: 9px 11px;
      font-size: 0.9rem;
      width: 100%;
    }
    input:focus, textarea:focus, .modal select:focus { outline: none; border-color: var(--accent); }

    textarea { resize: vertical; min-height: 70px; font-family: inherit; }

    .modal-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 20px;
    }

    /* Progress bar */
    .progress-section { margin-bottom: 20px; }
    .progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 5px;
    }
    .progress-bar {
      height: 6px;
      background: var(--surface2);
      border-radius: 3px;
      overflow: hidden;
      display: flex;
      gap: 2px;
    }
    .progress-bar div { height: 100%; transition: width 0.4s; }
    .pb-unpainted { background: #555; }
    .pb-primed    { background: #7f8c8d; }
    .pb-wip       { background: #e67e22; }
    .pb-done      { background: #27ae60; }

    @media (max-width: 480px) {
      header h1 { font-size: 1.05rem; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<header>
  <h1>⚔ Warhammer <span>Mini Tracker</span></h1>
  <div class="header-actions">
    <button class="btn-primary" onclick="openModal()">+ Add Mini</button>
  </div>
</header>

<main>
  <div class="stats" id="stats"></div>

  <div class="progress-section" id="progressSection"></div>

  <div class="filters">
    <input type="text" id="search" placeholder="Search name or faction…" oninput="render()" />
    <select id="filterFaction" onchange="render()"><option value="">All Factions</option></select>
    <select id="filterStatus" onchange="render()">
      <option value="">All Statuses</option>
      <option value="unpainted">Unpainted</option>
      <option value="primed">Primed</option>
      <option value="wip">WIP</option>
      <option value="done">Done</option>
    </select>
    <select id="sortBy" onchange="render()">
      <option value="added">Date Added</option>
      <option value="name">Name</option>
      <option value="faction">Faction</option>
      <option value="status">Status</option>
    </select>
  </div>

  <div class="grid" id="grid"></div>
</main>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="overlayClick(event)">
  <div class="modal">
    <h2 id="modalTitle">Add Mini</h2>
    <div class="form-row">
      <div class="field" style="flex:2">
        <label for="fName">Unit Name *</label>
        <input type="text" id="fName" placeholder="e.g. Space Marine Intercessors" />
      </div>
      <div class="field" style="flex:1">
        <label for="fQty">Qty</label>
        <input type="number" id="fQty" min="1" value="1" />
      </div>
    </div>
    <div class="field">
      <label for="fFaction">Faction / Army</label>
      <input type="text" id="fFaction" placeholder="e.g. Space Marines" list="factionList" />
      <datalist id="factionList"></datalist>
    </div>
    <div class="form-row">
      <div class="field">
        <label for="fStatus">Paint Status</label>
        <select id="fStatus">
          <option value="unpainted">Unpainted</option>
          <option value="primed">Primed</option>
          <option value="wip">WIP</option>
          <option value="done">Done</option>
        </select>
      </div>
      <div class="field">
        <label for="fPoints">Points Cost</label>
        <input type="number" id="fPoints" min="0" placeholder="e.g. 100" />
      </div>
    </div>
    <div class="field">
      <label for="fNotes">Notes</label>
      <textarea id="fNotes" placeholder="Basing ideas, colours, WIP progress…"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn-primary" onclick="saveMini()">Save</button>
    </div>
  </div>
</div>

<script>
  const STORAGE_KEY = 'wh_minis_v1';
  let minis = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  let editingId = null;

  const STATUS_ORDER = { unpainted: 0, primed: 1, wip: 2, done: 3 };
  const STATUS_LABEL = { unpainted: 'Unpainted', primed: 'Primed', wip: 'WIP', done: 'Done' };

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(minis));
  }

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2);
  }

  function factions() {
    return [...new Set(minis.map(m => m.faction).filter(Boolean))].sort();
  }

  function openModal(id = null) {
    editingId = id;
    const m = id ? minis.find(x => x.id === id) : null;
    document.getElementById('modalTitle').textContent = id ? 'Edit Mini' : 'Add Mini';
    document.getElementById('fName').value = m?.name || '';
    document.getElementById('fQty').value = m?.qty ?? 1;
    document.getElementById('fFaction').value = m?.faction || '';
    document.getElementById('fStatus').value = m?.status || 'unpainted';
    document.getElementById('fPoints').value = m?.points ?? '';
    document.getElementById('fNotes').value = m?.notes || '';
    document.getElementById('modalOverlay').classList.add('open');
    document.getElementById('fName').focus();
  }

  function closeModal() {
    document.getElementById('modalOverlay').classList.remove('open');
    editingId = null;
  }

  function overlayClick(e) {
    if (e.target === document.getElementById('modalOverlay')) closeModal();
  }

  function saveMini() {
    const name = document.getElementById('fName').value.trim();
    if (!name) { document.getElementById('fName').focus(); return; }

    const data = {
      name,
      qty: Math.max(1, parseInt(document.getElementById('fQty').value) || 1),
      faction: document.getElementById('fFaction').value.trim(),
      status: document.getElementById('fStatus').value,
      points: document.getElementById('fPoints').value !== '' ? parseInt(document.getElementById('fPoints').value) : null,
      notes: document.getElementById('fNotes').value.trim(),
    };

    if (editingId) {
      const idx = minis.findIndex(m => m.id === editingId);
      minis[idx] = { ...minis[idx], ...data };
    } else {
      minis.push({ id: uid(), added: Date.now(), ...data });
    }

    save();
    closeModal();
    render();
  }

  function deleteMini(id) {
    const m = minis.find(x => x.id === id);
    if (!confirm(`Delete "${m?.name}"?`)) return;
    minis = minis.filter(x => x.id !== id);
    save();
    render();
  }

  function render() {
    const search = document.getElementById('search').value.toLowerCase();
    const filterFaction = document.getElementById('filterFaction').value;
    const filterStatus = document.getElementById('filterStatus').value;
    const sortBy = document.getElementById('sortBy').value;

    // Update faction datalist
    const dl = document.getElementById('factionList');
    dl.innerHTML = factions().map(f => `<option value="${esc(f)}">`).join('');

    // Update faction filter dropdown
    const ff = document.getElementById('filterFaction');
    const prevFaction = ff.value;
    ff.innerHTML = '<option value="">All Factions</option>' +
      factions().map(f => `<option value="${esc(f)}" ${f === prevFaction ? 'selected' : ''}>${esc(f)}</option>`).join('');

    let filtered = minis.filter(m => {
      if (filterFaction && m.faction !== filterFaction) return false;
      if (filterStatus && m.status !== filterStatus) return false;
      if (search && !m.name.toLowerCase().includes(search) && !m.faction?.toLowerCase().includes(search)) return false;
      return true;
    });

    filtered.sort((a, b) => {
      if (sortBy === 'name') return a.name.localeCompare(b.name);
      if (sortBy === 'faction') return (a.faction || '').localeCompare(b.faction || '') || a.name.localeCompare(b.name);
      if (sortBy === 'status') return STATUS_ORDER[a.status] - STATUS_ORDER[b.status];
      return b.added - a.added;
    });

    // Stats
    const totalMinis = minis.reduce((s, m) => s + m.qty, 0);
    const counts = { unpainted: 0, primed: 0, wip: 0, done: 0 };
    minis.forEach(m => { counts[m.status] = (counts[m.status] || 0) + m.qty; });
    const totalPoints = minis.reduce((s, m) => s + (m.points != null ? m.points * m.qty : 0), 0);

    document.getElementById('stats').innerHTML = `
      <div class="stat-chip"><span class="dot" style="background:#888"></span>${minis.length} unit${minis.length !== 1 ? 's' : ''}</div>
      <div class="stat-chip"><span class="dot" style="background:#888"></span>${totalMinis} mini${totalMinis !== 1 ? 's' : ''}</div>
      ${totalPoints > 0 ? `<div class="stat-chip"><span class="dot" style="background:var(--gold)"></span>${totalPoints} pts</div>` : ''}
      <div class="stat-chip"><span class="dot" style="background:var(--done)"></span>${counts.done} painted</div>
    `;

    // Progress bar
    const ps = document.getElementById('progressSection');
    if (totalMinis > 0) {
      const pct = s => ((counts[s] / totalMinis) * 100).toFixed(1);
      ps.innerHTML = `
        <div class="progress-label"><span>Painting Progress</span><span>${counts.done} / ${totalMinis} done (${pct('done')}%)</span></div>
        <div class="progress-bar">
          <div class="pb-done"    style="width:${pct('done')}%"></div>
          <div class="pb-wip"     style="width:${pct('wip')}%"></div>
          <div class="pb-primed"  style="width:${pct('primed')}%"></div>
          <div class="pb-unpainted" style="width:${pct('unpainted')}%"></div>
        </div>
      `;
    } else {
      ps.innerHTML = '';
    }

    // Grid
    const grid = document.getElementById('grid');
    if (filtered.length === 0) {
      grid.innerHTML = `<div class="empty"><p>🎲</p><p>${minis.length === 0 ? 'No minis yet — add your first unit!' : 'No minis match your filters.'}</p></div>`;
      return;
    }

    grid.innerHTML = filtered.map(m => `
      <div class="card">
        <div class="card-top">
          <div class="card-name">${esc(m.name)}</div>
          <div class="card-qty">×${m.qty}</div>
        </div>
        ${m.faction ? `<div class="card-faction">${esc(m.faction)}</div>` : ''}
        <div class="card-meta">
          <span class="status-badge status-${m.status}">${STATUS_LABEL[m.status]}</span>
          ${m.points != null ? `<span class="card-points"><span>${m.points * m.qty}</span> pts${m.qty > 1 ? ` (${m.points}/model)` : ''}</span>` : ''}
        </div>
        ${m.notes ? `<div class="card-notes">${esc(m.notes)}</div>` : ''}
        <div class="card-actions">
          <button class="btn-edit" onclick="openModal('${m.id}')">Edit</button>
          <button class="btn-danger" onclick="deleteMini('${m.id}')">Delete</button>
        </div>
      </div>
    `).join('');
  }

  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // Keyboard shortcut: Escape closes modal
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeModal();
    if (e.key === 'Enter' && e.ctrlKey && document.getElementById('modalOverlay').classList.contains('open')) saveMini();
  });

  render();
</script>
</body>
</html>
